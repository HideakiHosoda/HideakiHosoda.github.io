<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Works</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      background: #fff;
      color: #222;
    }

    /* 全体のグリッド */
    .works {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
    }

    /* 1作品 */
    .work {
      display: flex;
      flex-direction: column;
    }

    .work img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #222;
    }

    .title {
      margin-top: 16px;
      font-size: 20px;
    }

    .desc {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.7;
      color: #555;
    }

    /* スマホ対応 */
    @media (max-width: 900px) {
      .works {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <section class="works">

    <article class="work">
      <img src="images/photo1.png" alt="写真1">
      <div class="title">作品タイトル</div>
      <div class="desc">
        説明説明説明説明説明説明説明説明説明説明<br>
        説明説明説明説明説明説明説明説明説明説明
      </div>
    </article>

    <article class="work">
      <img src="images/photo2.png" alt="写真2">
      <div class="title">作品タイトル</div>
      <div class="desc">
        説明説明説明説明説明説明説明説明説明説明<br>
        説明説明説明説明説明説明説明説明説明説明
      </div>
    </article>

    <article class="work">
      <img src="images/photo3.png" alt="写真3">
      <div class="title">作品タイトル</div>
      <div class="desc">
        説明説明説明説明説明説明説明説明説明説明<br>
        説明説明説明説明説明説明説明説明説明説明
      </div>
    </article>

  </section>

</body>
</html>
